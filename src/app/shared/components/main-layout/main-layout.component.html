<mat-drawer-container class="main-layout">
  <mat-drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidebarState()"
    class="main-layout__drawer"
  >
    <app-sidebar />
  </mat-drawer>

  <mat-drawer-content class="main-layout__content">
    <main class="main-layout__main">
      <router-outlet></router-outlet>
    </main>
  </mat-drawer-content>
</mat-drawer-container>
