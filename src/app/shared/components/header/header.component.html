<header class="header">
  <app-logo class="header__logo" />
  <button
    mat-icon-button
    class="header__hamburger-btn"
    aria-label="hamburger menu"
    (click)="toggleSidebar()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <button
    mat-icon-button
    *ngIf="user() && !isProfileCardOpen"
    class="header__profile-card-trigger"
    type="button"
    (click)="handleProfileIconClick()"
  >
    <app-avatar [name]="user()?.name" [profileImgUrl]="user()?.profileImgUrl" />
  </button>
  <app-profile-cart *ngIf="isProfileCardOpen" (closeProfileCart)="handleProfileIconClick()" />
</header>
