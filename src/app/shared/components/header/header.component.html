<header class="header">
  <a routerLink="/" class="header__logo"> <img [src]="appLogoSrc" alt="app logo" /></a>

  <button
    mat-icon-button
    (click)="handleMenuClick()"
    class="header__hamburger-btn"
    aria-label="hamburger menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <button class="header__profile">
    <img [src]="profileSrc" alt="profile icon" />
  </button>
</header>
