<div class="skeleton-dashboard">
  <div class="skeleton-dashboard__header">
    <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--title"></div>
    <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--select"></div>
  </div>
  <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--subtitle"></div>
  <div class="skeleton-dashboard__stats">
    <div class="skeleton-dashboard__card" *ngFor="let card of statsCardsSkeleton">
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--icon"></div>
      <div class="skeleton-dashboard__card-content">
        <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--label"></div>
        <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--value"></div>
      </div>
    </div>
  </div>
  <div class="skeleton-dashboard__report">
    <div>
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--report-title"></div>
      <div
        class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--report-description"
      ></div>
    </div>
    <div class="skeleton-dashboard__report-buttons">
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--button"></div>
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--button"></div>
    </div>
  </div>
  <div class="skeleton-dashboard__content">
    <div class="skeleton-dashboard__panel">
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--panel-title"></div>
      <div class="skeleton-dashboard__list-item" *ngFor="let item of topCustomerSkeleton">
        <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--avatar"></div>
        <div class="skeleton-dashboard__list-item-details">
          <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--name"></div>
          <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--email"></div>
        </div>
        <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--amount"></div>
      </div>
    </div>
    <div class="skeleton-dashboard__panel">
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--panel-title"></div>
      <div class="skeleton-dashboard__dish" *ngFor="let item of topDishesSkeleton">
        <div>
          <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--dish-name"></div>
          <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--restaurant"></div>
        </div>
        <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--orders"></div>
      </div>
    </div>
  </div>
  <div class="skeleton-dashboard__footer">
    <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--footer-text"></div>
    <div class="skeleton-dashboard__footer-icons">
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--social-icon"></div>
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--social-icon"></div>
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--social-icon"></div>
      <div class="skeleton-dashboard__skeleton skeleton-dashboard__skeleton--social-icon"></div>
    </div>
  </div>
</div>
