<section class="edit-restaurant">
  <button mat-stroked-button color="primary" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
    BACK
  </button>
  <header class="edit-restaurant__header">
    <h1 class="text-display edit-restaurant__title">Edit Restaurant</h1>
    <p class="text-caption edit-restaurant__description">
      Update the restaurant name, address, and owners.
    </p>
  </header>
  <mat-card class="edit-restaurant__card">
    <app-restaurant-form
      [isEditMode]="true"
      (formSubmit)="updateRestaurant($event)"
      (cancel)="goBack()"
      [userDetails]="userDetails"
    ></app-restaurant-form>
  </mat-card>
</section>
